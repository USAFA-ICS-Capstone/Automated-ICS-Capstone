# ---------------------------------------------------------------------------
# Approved MCP servers and tools (the "tool registry").
#
# Enable/disable servers or individual tools here; the agent code does not
# change. Only tools listed in `allowed_tools` are ever shown to the agent,
# and the same list is enforced again at call time (see mcp/policy.py).
#
# `${VAR:-default}` placeholders are expanded from the environment / .env.
# ---------------------------------------------------------------------------

# Docker API endpoint handed to every MCP server: the Docker socket itself, so
# the tools have FULL Docker access (no read-only proxy since 2026-11-09). What
# keeps them inside Docker: the agent runs in a container (deploy/agent) and
# Docker Desktop shares no Mac folders. See docs/running-the-agent.md.
docker_host: "${DOCKER_AUDIT_DOCKER_HOST:-unix:///var/run/docker.sock}"

servers:
  docker:
    enabled: true
    role: docker_inspection
    # Launched on demand with uvx: no manual install needed. The version is
    # pinned so a future release cannot silently change the tool surface.

    #This tells your application to launch a Docker MCP server using:
    #The MCP server exposes Docker operations as tools the LLM can request.
    command: uvx
    args: ["docker-mcp-server==2.2.7"]
    env:
      DOCKER_MCP_SERVER_READONLY: "1"   # server unregisters non-read-only tools
    client_session_timeout_seconds: 60
    # Even in read-only mode this server registers ~77 tools, including
    # secret_inspect, swarm_join_tokens, swarm_unlock_key and
    # container_archive_get (copies files out of containers). Only the tools
    # below are approved.

    # These are the tools the agent is permitted to see and call.
    allowed_tools:
      - container_list
      - container_inspect
      - image_list
      - image_inspect
      - image_history
      - network_list
      - network_inspect
      - volume_list
      - volume_inspect
      - system_info
      - system_version

  # Trivy is a vulnerability scanner. In your project, it helps identify known vulnerabilities in Docker images.
  # For example, your agent might:
#1. Call image_list to discover the Docker images.
#2. Call scan_image on an approved image.
#3. Receive vulnerability findings.
#4. Analyze and prioritize the results.
  trivy:
    enabled: true
    role: image_scanner
    command: trivy
    args: ["mcp", "--transport", "stdio"]
    env: {}
    # Image scans can take minutes on first run for big images.
    client_session_timeout_seconds: 900
    allowed_tools:
      - scan_image
      - findings_list
      - findings_get
      - trivy_version
    # trivy-mcp is a Trivy *plugin*. If it is missing, `docker-audit setup`
    # (and `assess`, when auto_install is true) installs this pinned version.
    setup:
      auto_install: true
      check_command: ["trivy", "plugin", "list"]
      check_contains: "mcp"
      install_command: ["trivy", "plugin", "install", "mcp@v0.0.20"]

  # ------------------------------------------------------------------------
  # PHASE 2 — network verification servers (used only by `docker-audit verify`,
  # never by `assess`). These ACT on the network, so their vantage point is the
  # agent container itself, which `verify` attaches to the GRFICS ICS/DMZ
  # networks (deploy/agent/compose.grfics.example.yml). They are launched as
  # stdio subprocesses from pinned git clones baked into the image (see
  # Dockerfile); on a host without those clones they simply fail to connect.
  # ------------------------------------------------------------------------

  # NmapMCP (0xPratikPatil): reachability + service/version. ~47 tools exist;
  # only these three are approved, and each takes just target/port (no raw
  # flags), so the argument_policy below only has to validate the target.
  nmap:
    enabled: true
    role: network_scanner
    command: uv
    # --no-sync: use the venv baked at build time; never re-resolve at runtime
    # (the image is offline, so a runtime sync would fail).
    args: ["--directory", "${NMAPMCP_DIR:-/opt/nmapmcp}", "run", "--no-sync", "python", "main.py"]
    # Pin uv to this server's own venv (the image sets a global
    # UV_PROJECT_ENVIRONMENT=/opt/venv for the agent app, which must not be reused).
    env:
      UV_PROJECT_ENVIRONMENT: "${NMAPMCP_DIR:-/opt/nmapmcp}/.venv"
    client_session_timeout_seconds: 300
    allowed_tools:
      - check_single_port   # one port, e.g. kali -> plc:502
      - quick_scan          # fast open-port sweep
      - service_scan        # service/version (-sV)

  # modbus-mcp (kukapay): ICS protocol reads. The PLC target is pinned by env
  # (MODBUS_HOST/PORT), not by a tool argument, so no argument gate is needed.
  # Only READ tools are approved this pass; write_register/write_coil are left
  # out of the allow-list (they belong to the later attacker-analysis phase).
  modbus:
    enabled: true
    role: ics_protocol
    command: uv
    args: ["--directory", "${MODBUS_MCP_DIR:-/opt/modbus-mcp}", "run", "--no-sync", "modbus-mcp"]
    env:
      UV_PROJECT_ENVIRONMENT: "${MODBUS_MCP_DIR:-/opt/modbus-mcp}/.venv"
      MODBUS_TYPE: "${MODBUS_TYPE:-tcp}"
      MODBUS_HOST: "${MODBUS_HOST:-plc}"
      MODBUS_PORT: "${MODBUS_PORT:-502}"
    client_session_timeout_seconds: 60
    allowed_tools:
      - read_register
      - read_input_registers
      - read_coils
      - read_multiple_holding_registers

# Per-tool argument rules enforced by mcp/policy.py.
argument_policy:
  scan_image:
    # Only images present in the current inventory snapshot may be scanned.
    restrict_targets_to_inventory: true
    # "secret" scanning is excluded on purpose: it would return secret values.
    allowed_scan_types: ["vuln"]
    forced_output_format: json

  # Phase 2: nmap may only be pointed at the GRFICS lab. A scan whose target is
  # neither an IP in these subnets nor one of these lab hostnames is refused.
  nmap:
    restrict_targets: true
    allowed_cidrs:
      - 192.168.95.0/24   # grficsv3_b-ics-net (the PLC / Modbus segment)
      - 192.168.90.0/24   # grficsv3_c-dmz-net
    allowed_hostnames:
      - plc
      - hmi
      - ews
      - kali
      - router
      - caldera
      - simulation
