# ---------------------------------------------------------------------------
# Read-only Docker API proxy (security boundary for the assessment agent).
#
# Why this exists:
#   Access to the Docker socket is effectively root on the Docker host. Even an
#   MCP server that only *intends* to read could be buggy or mis-categorize a
#   tool. This proxy (HAProxy under the hood) sits between every MCP server and
#   the real Docker socket and only forwards the request types we allow.
#
# What it allows:
#   - GET / HEAD requests only (POST=0 is the default; we state it explicitly).
#   - Only these API sections: containers, images, networks, volumes, info,
#     version (plus ping, which is always on).
#   Everything else (exec, build, secrets, auth, swarm, system/prune, ...)
#   returns HTTP 403 Forbidden.
#
# How the app uses it:
#   MCP servers are launched with DOCKER_HOST=tcp://127.0.0.1:2375 so they talk
#   to the proxy, never to /var/run/docker.sock directly.
#
# Start:  docker compose -f deploy/socket-proxy/compose.yml up -d
# Stop:   docker compose -f deploy/socket-proxy/compose.yml down
# ---------------------------------------------------------------------------
name: docker-audit-proxy

services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0   # pinned version (2026-07-27)
    container_name: docker-audit-socket-proxy
    restart: unless-stopped
    environment:
      POST: "0"          # read-only: no create/start/stop/exec/delete
      CONTAINERS: "1"    # GET /containers/json, /containers/{id}/json
      IMAGES: "1"        # GET /images/json, /images/{id}/json, /images/{id}/get (Trivy export)
      NETWORKS: "1"      # GET /networks, /networks/{id}
      VOLUMES: "1"       # GET /volumes, /volumes/{name}
      INFO: "1"          # GET /info
      VERSION: "1"       # GET /version
      # Explicitly denied (these are already the defaults; listed for reviewers):
      EXEC: "0"
      BUILD: "0"
      SECRETS: "0"
      AUTH: "0"
      SWARM: "0"
      SYSTEM: "0"
      PLUGINS: "0"
    volumes:
      # The proxy itself needs the socket; it is the ONLY component that gets it.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      # Bind to loopback only so nothing on the LAN can reach the Docker API.
      - "127.0.0.1:2375:2375"
    read_only: true
    tmpfs:
      - /run
      - /tmp            # the entrypoint renders haproxy.cfg into /tmp
    security_opt:
      - no-new-privileges:true
    labels:
      com.docker-audit.role: "read-only-docker-api-proxy"
