# ---------------------------------------------------------------------------
# Containerized Docker Security Assessment Agent (docker-audit).
#
# The agent is a CLI, so it runs as one-shot containers. Use the wrapper, which
# also copies each run's reports and databases back to the Mac:
#
#   deploy/agent/build.sh                  # = compose build, + git provenance
#   deploy/agent/run.sh setup              # once: Trivy DB
#   deploy/agent/run.sh doctor             # preflight
#   deploy/agent/run.sh assess --model local-vllm --range-baseline clean-v2
#   docker compose -f deploy/agent/compose.yml run --rm test   # pytest in Docker
#
# Anything after the command is passed to `docker-audit` (ENTRYPOINT). With no
# arguments the container runs `docker-audit doctor`.
#
# How the container reaches its dependencies:
#   vLLM    -> host.docker.internal:8000 (the SSH tunnel to the GPU VM on the Mac)
#   Docker  -> the Docker socket, FULL access (no read-only proxy since harness h4)
#   MCP     -> docker-mcp-server and trivy-mcp run as stdio subprocesses
#              INSIDE this container, so their reach is this container + Docker
#
# Containment (harness h4): this container mounts NO folder from the Mac.
# Config is baked into the image (rebuild after changing config/), and reports
# and databases live in the Docker volumes below; run.sh copies them to the Mac
# with `docker cp`, which does not need Docker Desktop file sharing. Together
# with file sharing turned off in Docker Desktop, nothing the agent does through
# Docker can reach the Mac's files.
#
# Every host-specific value is an environment variable with a default; set
# them in your shell or pass `--env-file`. They are named AGENT_* so they never
# collide with the host-workflow values in the repository's .env.
#
# GRFICS networks are NOT joined here. See compose.grfics.example.yml.
# ---------------------------------------------------------------------------
name: docker-audit-agent

x-agent: &agent
  image: ${AGENT_IMAGE:-docker-audit-agent:latest}
  build:
    context: ../..
    dockerfile: Dockerfile
    target: runtime
    args: &build-args
      # git provenance for run manifests (set by deploy/agent/build.sh)
      BUILD_COMMIT: ${AGENT_BUILD_COMMIT:-}
      BUILD_DIRTY: ${AGENT_BUILD_DIRTY:-}
  # API keys etc. (OPENAI_API_KEY, VLLM_API_KEY, OPENAI_MODEL) come from the
  # same git-ignored .env the host workflow uses, if it exists. Values under
  # `environment:` below win over it.
  env_file:
    - path: ../../.env
      required: false
  environment:
    OLLAMA_BASE_URL: ${AGENT_OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
    VLLM_BASE_URL: ${AGENT_VLLM_BASE_URL:-http://host.docker.internal:8000/v1}
    DOCKER_AUDIT_DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_AUDIT_CONFIG_DIR: /app/config
  extra_hosts:
    # Docker Desktop already resolves host.docker.internal; this also makes it
    # work on Linux engines.
    - "host.docker.internal:host-gateway"
  volumes:
    # The Docker socket inside Docker Desktop's VM (not a Mac folder): full
    # Docker access for the MCP servers.
    - /var/run/docker.sock:/var/run/docker.sock
    # Docker-only storage, never Mac folders (run.sh copies results out).
    - agent-data:/app/data
    - agent-outputs:/app/outputs
    # Trivy vulnerability DB + layer cache (filled by `setup`).
    - trivy-cache:/home/agent/.cache/trivy
  # Hardening: non-root (uid 10001, set in the image), no Linux capabilities,
  # no privilege escalation. Group 0 only to open the Docker socket.
  # init reaps the MCP subprocesses.
  user: "10001:10001"
  group_add:
    - "0"
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  init: true
  pids_limit: 512
  tmpfs:
    - /tmp

services:
  agent:
    <<: *agent
    networks:
      - default            # egress: vLLM tunnel on the Mac, Trivy DB download

  # The automated test suite, inside the image (dev dependencies + tests).
  # No network at all: the tests use fakes, not Docker or an LLM.
  test:
    <<: *agent
    build:
      context: ../..
      dockerfile: Dockerfile
      target: test
      args: *build-args
    image: ${AGENT_TEST_IMAGE:-docker-audit-agent:test}
    profiles: [test]
    network_mode: none
    volumes: []
    env_file: []
    environment: {}
    extra_hosts: []
    # The range.sh tests put a fake `docker` executable under /tmp; Docker mounts
    # tmpfs noexec by default (kept for the agent service).
    tmpfs:
      - /tmp:exec

volumes:
  agent-data:
  agent-outputs:
  trivy-cache:
