# ---------------------------------------------------------------------------
# Phase 2 (network verification) vantage point — "Option A", Kali-faithful.
#
# NOT loaded by default (Compose ignores this file unless it is passed with
# -f). It attaches the agent container to EXACTLY the networks the kali
# container is on — the DMZ and the admin bridge — so the nmap/modbus MCP
# servers (stdio subprocesses INSIDE the agent container) probe the PLC from
# the same vantage point a DMZ attacker has, without running anything inside
# kali.
#
# Deliberately NOT on the ICS network (b-ics-net): giving the agent a direct
# interface on the plant floor would let it reach the PLC without crossing the
# DMZ->ICS boundary, which is the very thing under test. On this bridge lab the
# PLC's hostname ("plc") resolves to its admin-bridge IP, so the agent reaches
# plc:502 over the shared admin bridge exactly as kali does.
#
#   docker compose -f deploy/agent/compose.yml \
#                  -f deploy/agent/compose.grfics.example.yml \
#                  run --rm agent verify
#
# The networks must already exist (GRFICS is started separately) and are
# declared external, so this file never creates, changes or removes them.
# Their names are <GRFICS compose project>_<network>, e.g. grficsv3_b-ics-net;
# check with `docker network ls`.
#
# Attaching only changes which IP networks the agent container has interfaces
# on. It adds no tools: the agent is still limited to the approved MCP tools in
# config/mcp_servers.yaml, and nmap is still gated to the lab subnets.
# ---------------------------------------------------------------------------
services:
  agent:
    networks:
      default: {}
      grfics-dmz: {}     # 192.168.90.0/24 — the DMZ, where kali lives
      grfics-admin: {}   # 172.18.0.0/16  — the admin bridge, kali's other interface
    environment:
      # Point the modbus MCP server at the PLC on the ICS network. Use the
      # GRFICS service name (Docker DNS) or the PLC's static IP.
      MODBUS_HOST: ${GRFICS_PLC_HOST:-plc}
      MODBUS_PORT: ${GRFICS_PLC_PORT:-502}
      MODBUS_TYPE: tcp

networks:
  grfics-dmz:
    external: true
    name: ${GRFICS_DMZ_NETWORK:-grficsv3_c-dmz-net}
  grfics-admin:
    external: true
    name: ${GRFICS_ADMIN_NETWORK:-grficsv3_a-grfics-admin}
