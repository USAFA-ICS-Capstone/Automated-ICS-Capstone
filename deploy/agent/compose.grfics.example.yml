# ---------------------------------------------------------------------------
# Phase 2 (network exposure) vantage point — "Option A", Kali-faithful.
#
# NOT loaded by default (Compose ignores this file unless it is passed with
# -f). The agent container JOINS THE KALI CONTAINER'S NETWORK STACK
# (network_mode: container:kali): same interfaces, same IPs, same routing
# table as kali, so the nmap/modbus MCP servers (stdio subprocesses INSIDE the
# agent container) probe the lab from exactly the position a DMZ attacker on
# kali has, without running anything inside kali itself.
#
# Why not attach the agent to kali's networks instead (the old way)? Attaching
# gives the same subnets but NOT kali's routes. kali reaches the ICS network
# through the GRFICS router (192.168.95.0/24 via 192.168.90.200) and its
# default route is the admin bridge; an attached agent had neither, so its
# packets to 192.168.95.x left through Docker's default network and the ICS
# sweep timed out (net-20261118-165111-a208). Sharing kali's stack copies
# nothing by hand, so it cannot drift from kali.
#
#   docker compose -f deploy/agent/compose.yml \
#                  -f deploy/agent/compose.grfics.example.yml \
#                  run --rm agent network
#
# Requirements and side effects:
# - kali must be running (start GRFICS first). If kali restarts during a run,
#   the agent loses its network.
# - The agent's traffic leaves with kali's IP addresses, as a real attacker on
#   kali would.
# - The name host.docker.internal does NOT resolve inside kali's stack (it came
#   from extra_hosts, which network_mode: container:... does not allow), so the
#   model endpoints below use Docker Desktop's host-gateway IP, 192.168.65.254
#   (the Mac; the SSH tunnel to vLLM listens there). Check it with:
#     docker run --rm --add-host probe:host-gateway alpine getent hosts probe
#   and override with AGENT_HOST_GATEWAY_IP if it differs.
# - The agent still has NO extra privileges (cap_drop ALL, non-root): it only
#   uses kali's network, it cannot change it. It adds no tools either: the
#   agent is still limited to the approved MCP tools in config/mcp_servers.yaml,
#   and nmap is still gated to the lab subnets.
# ---------------------------------------------------------------------------
services:
  agent:
    network_mode: "container:${GRFICS_KALI_CONTAINER:-kali}"
    # Both conflict with network_mode: container:..., so clear the base file's.
    networks: !reset {}
    extra_hosts: !reset []
    environment:
      VLLM_BASE_URL: http://${AGENT_HOST_GATEWAY_IP:-192.168.65.254}:8000/v1
      OLLAMA_BASE_URL: http://${AGENT_HOST_GATEWAY_IP:-192.168.65.254}:11434/v1
      # Point the modbus MCP server at the PLC. Use the GRFICS service name
      # (Docker DNS, as kali resolves it) or the PLC's static IP.
      # The modbus server's DEFAULT device (when a read omits host). The agent
      # can also target any host in the ICS subnet per call (gated in
      # config/mcp_servers.yaml -> argument_policy.modbus).
      GRFICS_PLC_HOST: ${GRFICS_PLC_HOST:-plc}
      GRFICS_PLC_PORT: ${GRFICS_PLC_PORT:-502}
